name: CI Main

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm

      - name: Restore dependencies
        run: npm ci

      - name: Create .env.test
        run: |
          echo "NEXT_PUBLIC_ENV=TEST" >> .env.test
          echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env.test
          echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> .env.test
          echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> .env.test
          echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}" >> .env.test
          echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}" >> .env.test
          echo "CLOUDINARY_ROOT_FOLDER_TEST=${{ secrets.CLOUDINARY_ROOT_FOLDER_TEST }}" >> .env.test
          echo "CLOUDINARY_ROOT_FOLDER_PROD=${{ secrets.CLOUDINARY_ROOT_FOLDER_PROD }}" >> .env.test
          echo "SITE_TEST_URL=${{ secrets.SITE_TEST_URL }}" >> .env.test
          echo "SITE_PROD_URL=${{ secrets.SITE_PROD_URL }}" >> .env.test

      - name: Build for Cloudflare Workers (OpenNext)
        run: npm run build:test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Lint
        run: npm run lint

      - name: Upload secrets to Worker
        run: |
          printf '{\n  "ADMIN_PASSWORD": "%s",\n  "SESSION_SECRET": "%s",\n  "CLOUDINARY_API_KEY": "%s",\n  "CLOUDINARY_API_SECRET": "%s"\n}' \
            "$ADMIN_PASSWORD" "$SESSION_SECRET" \
            "$CLOUDINARY_API_KEY" "$CLOUDINARY_API_SECRET" | npx wrangler secret bulk --env test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      - name: Deploy to Cloudflare Workers TEST
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env test

  release-please:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@7987652d64b4581673a76e33ad5e98e3dd56832f # v4.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  cd-prod:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm

      - name: Restore dependencies
        run: npm ci

      - name: Create .env.prod
        run: |
          echo "NEXT_PUBLIC_ENV=PROD" >> .env.prod
          echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env.prod
          echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> .env.prod
          echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> .env.prod
          echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}" >> .env.prod
          echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}" >> .env.prod
          echo "CLOUDINARY_ROOT_FOLDER_TEST=${{ secrets.CLOUDINARY_ROOT_FOLDER_TEST }}" >> .env.prod
          echo "CLOUDINARY_ROOT_FOLDER_PROD=${{ secrets.CLOUDINARY_ROOT_FOLDER_PROD }}" >> .env.prod
          echo "SITE_TEST_URL=${{ secrets.SITE_TEST_URL }}" >> .env.prod
          echo "SITE_PROD_URL=${{ secrets.SITE_PROD_URL }}" >> .env.prod

      - name: Build for Cloudflare Workers (OpenNext)
        run: npm run build:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload secrets to Worker
        run: |
          printf '{\n  "ADMIN_PASSWORD": "%s",\n  "SESSION_SECRET": "%s",\n  "CLOUDINARY_CLOUD_NAME": "%s",\n  "CLOUDINARY_API_KEY": "%s",\n  "CLOUDINARY_API_SECRET": "%s",\n  "CLOUDINARY_ROOT_FOLDER_TEST": "%s",\n  "CLOUDINARY_ROOT_FOLDER_PROD": "%s",\n  "SITE_TEST_URL": "%s",\n  "SITE_PROD_URL": "%s"\n}' \
            "$ADMIN_PASSWORD" "$SESSION_SECRET" "$CLOUDINARY_CLOUD_NAME" \
            "$CLOUDINARY_API_KEY" "$CLOUDINARY_API_SECRET" \
            "$CLOUDINARY_ROOT_FOLDER_TEST" "$CLOUDINARY_ROOT_FOLDER_PROD" \
            "$SITE_TEST_URL" "$SITE_PROD_URL" | npx wrangler secret bulk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_ROOT_FOLDER_TEST: ${{ secrets.CLOUDINARY_ROOT_FOLDER_TEST }}
          CLOUDINARY_ROOT_FOLDER_PROD: ${{ secrets.CLOUDINARY_ROOT_FOLDER_PROD }}
          SITE_TEST_URL: ${{ secrets.SITE_TEST_URL }}
          SITE_PROD_URL: ${{ secrets.SITE_PROD_URL }}

      - name: Deploy to Cloudflare Workers PROD
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
